# Ensure ~/.local/bin (and friends) are on PATH for the graphical session.
# GDM's Wayland session does not source ~/.profile, so PATH additions made
# there (or in fish) are absent from sway and anything it launches (e.g. wofi).
# systemd's user environment generator reads this file and applies it session-wide.
PATH=${HOME}/.local/bin:${HOME}/.local/bin/x86_64-linux:${HOME}/scripts:${PATH}
